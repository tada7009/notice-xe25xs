<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>금융사별 업무 공지</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#1d1c1a;--muted:#6b6862;--line:#e3e0d9;--accent:#1f5fbf;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--surface:#1e1e1c;--ink:#ecebe7;--muted:#a19e97;--line:#34332f;--accent:#7fa8ec;--err:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--muted);font-size:13px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:flex;gap:6px;align-items:center;margin:12px 0;font-size:13px;color:var(--muted)}
button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<form id="f">
 <h1>금융사별 업무 공지</h1>
 <p>비밀번호를 입력하세요.</p>
 <input id="pw" type="password" autocomplete="current-password" autofocus>
 <label><input id="rem" type="checkbox"> 이 기기에서 기억하기</label>
 <button type="submit">열기</button>
 <div class="err" id="err"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(buf);
}
function show(html){ document.open(); document.write(html); document.close(); }
const err = document.getElementById('err');
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  err.textContent = '확인 중…';
  try {
    const html = await unlock(pw);
    try { if (document.getElementById('rem').checked) localStorage.setItem('np', pw); } catch(_){}
    show(html);
  } catch(_) { err.textContent = '비밀번호가 맞지 않습니다.'; }
};
(async () => {
  let saved = null; try { saved = localStorage.getItem('np'); } catch(_){}
  if (saved) { try { show(await unlock(saved)); } catch(_) { try { localStorage.removeItem('np'); } catch(__){} } }
})();
</script>
